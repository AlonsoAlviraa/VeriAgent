<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="VeriFleet architecture">
  <rect width="960" height="540" fill="#07090f"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#07090f" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#g)"/>
  <text x="32" y="36" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">VeriFleet — Fortified Enterprise Fleet</text>
  <text x="32" y="58" font-family="Segoe UI, sans-serif" font-size="12" fill="#94A3B8">Gemini 3.5 + Google ADK + Cloud Run / Cloud SQL / Pub/Sub · the LLM never writes the hash</text>

  <rect x="32" y="84" width="180" height="64" rx="10" fill="#121826" stroke="#334155"/>
  <text x="122" y="112" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">UI /fleet</text>
  <text x="122" y="130" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8">drop invoices · no chat</text>

  <rect x="252" y="84" width="200" height="64" rx="10" fill="#121826" stroke="#334155"/>
  <text x="352" y="112" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">Pub/Sub</text>
  <text x="352" y="130" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8">invoice.received</text>

  <rect x="492" y="84" width="200" height="64" rx="10" fill="#0f231c" stroke="#34d399"/>
  <text x="592" y="112" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#6EE7B7">Agent Gateway</text>
  <text x="592" y="130" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8">identity · policy · armor</text>

  <rect x="732" y="84" width="196" height="64" rx="10" fill="#121826" stroke="#334155"/>
  <text x="830" y="112" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">Cloud Run</text>
  <text x="830" y="130" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8">OTel → Cloud Trace</text>

  <rect x="32" y="188" width="896" height="210" rx="14" fill="#0c1612" stroke="#34d399"/>
  <text x="52" y="216" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#6EE7B7">Google ADK · FiscalFleetOrchestrator · gemini-3.5-flash</text>

  <rect x="52" y="236" width="200" height="72" rx="8" fill="#121826" stroke="#14532d"/>
  <text x="152" y="266" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">Ingestion</text>
  <text x="152" y="286" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8">OCR / JSON extract</text>

  <rect x="272" y="236" width="200" height="72" rx="8" fill="#121826" stroke="#14532d"/>
  <text x="372" y="266" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">Fiscal Auditor</text>
  <text x="372" y="286" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8">math · NIF · memory</text>

  <rect x="492" y="236" width="200" height="72" rx="8" fill="#121826" stroke="#14532d"/>
  <text x="592" y="266" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">Signer</text>
  <text x="592" y="286" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8">tools only · no hash</text>

  <rect x="712" y="236" width="196" height="72" rx="8" fill="#121826" stroke="#14532d"/>
  <text x="810" y="266" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">Escalation</text>
  <text x="810" y="286" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8">human queue</text>

  <text x="52" y="344" font-family="Segoe UI, sans-serif" font-size="12" fill="#94A3B8">Registry · Memory Bank · Model Armor · consult may tighten SIGN→ESCALATE, never loosen a failed gate</text>
  <text x="52" y="366" font-family="Segoe UI, sans-serif" font-size="12" fill="#94A3B8">Gemini 3.5 consult is advisory. Deterministic gates own math, injection, and tool allowlists.</text>

  <rect x="32" y="424" width="440" height="84" rx="10" fill="#121826" stroke="#334155"/>
  <text x="52" y="456" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">core_engine (pre-existing kernel, disclosed)</text>
  <text x="52" y="478" font-family="Segoe UI, sans-serif" font-size="12" fill="#94A3B8">SHA-256 hash chain · Facturae XML · AEAT fail-closed</text>
  <text x="52" y="496" font-family="Segoe UI, sans-serif" font-size="12" fill="#64748B">0% hallucination on the fingerprint</text>

  <rect x="492" y="424" width="436" height="84" rx="10" fill="#121826" stroke="#334155"/>
  <text x="512" y="456" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">Cloud SQL Postgres</text>
  <text x="512" y="478" font-family="Segoe UI, sans-serif" font-size="12" fill="#94A3B8">invoices · fleet_runs · agent_registry · agent_memories</text>
  <text x="512" y="496" font-family="Segoe UI, sans-serif" font-size="12" fill="#64748B">tenant-scoped · durable across weeks</text>
</svg>
