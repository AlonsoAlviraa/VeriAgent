apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: verifleet
  labels:
    cloud.googleapis.com/location: europe-west1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        run.googleapis.com/cloudsql-instances: project-89d8567f-49f2-48bc-a00:europe-west1:verifleet-pg
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: europe-west1-docker.pkg.dev/project-89d8567f-49f2-48bc-a00/verifleet/verifleet@sha256:921dc39351f706c24054fec5f1fc21ce6e24739bfcc64853a4301a6110059327
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          env:
            - name: VERIFLEET_GEMINI_MODEL
              value: gemini-3.5-flash
            - name: VERIFLEET_SKIP_LLM
              value: "1"
            - name: GOOGLE_CLOUD_PROJECT
              value: project-89d8567f-49f2-48bc-a00
            - name: VERIAGENT_AUTO_INIT_DB
              value: "1"
            - name: PUBSUB_TOPIC
              value: projects/project-89d8567f-49f2-48bc-a00/topics/invoice.received
            - name: VERIFLEET_PUBSUB_PUSH
              value: "1"
            - name: DATABASE_URL
              value: postgresql://veriagent:securepassword@/veriagent_core?host=/cloudsql/project-89d8567f-49f2-48bc-a00:europe-west1:verifleet-pg
            - name: PYTHONUNBUFFERED
              value: "1"
